<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>出车收支日历 Web 预览</title>
  <link rel="stylesheet" href="./styles.css?v=20260910-flow-compact">
</head>
<body>
  <div class="app-shell">
    <main id="app" class="app-main"></main>

    <nav class="tabbar" aria-label="主导航">
      <button class="tab active" data-view="flow" type="button">
        <span class="tab-icon">💧</span>
        <span>流水</span>
      </button>
      <button class="tab" data-view="calendar" type="button">
        <span class="tab-icon">📅</span>
        <span>日历</span>
      </button>
      <button class="tab" data-view="stats" type="button">
        <span class="tab-icon">📊</span>
        <span>统计</span>
      </button>
      <button class="tab" data-view="mine" type="button">
        <span class="tab-icon">👤</span>
        <span>我的</span>
      </button>
    </nav>
  </div>

  <script src="./app.js?v=20260910-flow-compact"></script>

</html>
